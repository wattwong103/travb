<section class="news-block" aria-labelledby="news-heading">
  <div class="section-head">
    <h2 id="news-heading">News</h2>
    <a href="{{ '/news/' | relative_url }}">All news</a>
  </div>
  <ol class="news-list">
    {% for article in site.data.news limit:9 %}
    <li class="news-item">
      <time class="news-date">{{ article.date }}</time>
      <p class="news-headline">{{ article.headline }}</p>
    </li>
    {% endfor %}
  </ol>
</section>
